<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);

    ctx.fillStyle = "white";
    ctx.fillRect(0,0,w,h);

     function drawGrid(gridSize) {
            ctx.beginPath();
            // Set grid styling
            ctx.strokeStyle = "#e0e0e0"; 
            ctx.lineWidth = 1;

            // Loop across the width and height of the 600x600 canvas
            for (let x = 0; x <= 600; x += gridSize) {
                // Vertical lines (moving across the X axis, drawing from top to bottom)
                ctx.moveTo(x, 0);
                ctx.lineTo(x, 600);

                // Horizontal lines (moving down the Y axis, drawing from left to right)
                ctx.moveTo(0, x);
                ctx.lineTo(600, x);
            }

            // Commit the entire path to the screen at once for optimal performance
            ctx.stroke();
        }

        // Draw a grid with square sizes of 40x40 pixels
        //drawGrid(40); 


    // main blade
    ctx.fillStyle = '#A9A9A9'; // Metallic silver
    ctx.beginPath();
    ctx.moveTo(300, 20);    // Blade tip
    ctx.quadraticCurveTo(320, 80, 320, 120); // 2. Control point, then End point
    ctx.lineTo(320, 400);   // Lower right blade base
    ctx.lineTo(280, 400);  // Lower left blade base
    ctx.lineTo(280, 120); 
    ctx.quadraticCurveTo(280, 80, 300, 20);   // Upper left shoulder
    ctx.closePath();
    ctx.fill();
    

    // center line
    ctx.strokeStyle = '#707070';
    ctx.beginPath();
    ctx.moveTo(300, 80);
    ctx.lineTo(300, 400);
    ctx.stroke();

    //two diamonds
    ctx.fillStyle = '#A9A9A9'
    ctx.beginPath();
    let x = 260;
    let y = 380;
    let width = 80;
    let height = 80;
    let degrees = 45; 

    let centerX = x + width / 2;
    let centerY = y + height / 2;

    ctx.save(); 
    ctx.translate(centerX, centerY); 
    ctx.rotate(degrees * Math.PI / 180); 
    ctx.fillRect(-width / 2, -height / 2, width, height);
    ctx.restore(); 

    ctx.save(); 
    ctx.translate(centerX, centerY+60); 
    ctx.rotate(degrees * Math.PI / 180); 
    ctx.fillRect(-width / 2, -height / 2, width -20, height -20);
    ctx.restore(); 

    //handle
    ctx.fillStyle = '#D11A2A'
    ctx.fillRect(285,480,30,100)
    ctx.fillRect(200,480,200,20)
    
    //handle circles red
    ctx.beginPath();
    ctx.arc(300, 570, 25, 0, 2 * Math.PI);
    ctx.fill();
     ctx.beginPath();
    ctx.arc(210, 490, 20, 0, 2 * Math.PI);
    ctx.fill()
     ctx.beginPath();
    ctx.arc(390, 490, 20, 0, 2 * Math.PI);
    ctx.fill()
    
    //white circles
    ctx.fillStyle = "white"
    ctx.beginPath();
    ctx.arc(265, 405, 15, 0, 2 * Math.PI); 
    ctx.fill();
    ctx.beginPath();
    ctx.arc(335, 405, 15, 0, 2 * Math.PI); 
    ctx.fill();
    ctx.beginPath();
    ctx.arc(300, 420, 12, 0, 2 * Math.PI); 
    ctx.fill();
     ctx.beginPath();
    ctx.arc(300, 450, 8, 0, 2 * Math.PI); 
    ctx.fill();
    // handle cricles
    ctx.beginPath();
    ctx.arc(300, 570, 12, 0, 2 * Math.PI); 
    ctx.fill();
    ctx.beginPath();
    ctx.arc(210, 490, 9, 0, 2 * Math.PI); 
    ctx.fill();
    ctx.beginPath();
    ctx.arc(390, 490, 9, 0, 2 * Math.PI); 
    ctx.fill();
    // center diamond
    ctx.fillStyle = "darkblue"
    ctx.beginPath();
    x = 280;
    y = 470;
    width = 40;
    height = 40;
    degrees = 45; 
    
    centerX = x + width / 2;
    centerY = y + height / 2;

    ctx.save(); 

    ctx.translate(centerX, centerY); 
    ctx.rotate(degrees * Math.PI / 180); 
    ctx.fillRect(-width / 2, -height / 2, width, height);

    ctx.restore(); 



   

</script>
