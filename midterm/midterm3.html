<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);

    let runesVisible = false;
    let startTime = 0;

    const COLORS = [
    "#2f8bff", "#4aa5ff", "#6dc0ff", "#9ad8ff", "#c8ecff", "#9ad8ff", "#6dc0ff", "#4aa5ff"
    ];


    canvas.addEventListener("click", () => {
        if (!runesVisible) {
            runesVisible = true;
            startTime = Date.now(); 
        }
    });

    ctx.fillStyle = "white";
    ctx.fillRect(0,0,w,h);

    function draw(w,h){}


    function drawSword(w,h){
    //two diamonds
    
    
    ctx.fillStyle = '#A9A9A9'
    ctx.beginPath();

    drawDiamond(w*(300/600),h*(420/600),w*(80/600),h*(80/600))
    drawDiamond(w*(300/600),h*(470/600),w*(60/600),h*(60/600));

    
    // main blade
    ctx.fillStyle = '#A9A9A9'; 
    ctx.beginPath();
    ctx.moveTo(w*(300/600),h*(20/600));     
    ctx.quadraticCurveTo(w*(320/600), h*(80/600), w*(320/600), h*(120/600)); 
    ctx.lineTo(w*(320/600), h*(400/600));  
    ctx.lineTo(w*(280/600), h*(400/600));  
    ctx.lineTo(w*(280/600), h*(120/600)); 
    ctx.quadraticCurveTo(w*(280/600), h*(80/600), w*(300/600), h*(20/600));  
    ctx.closePath();
    ctx.fill();
    

    // center line
    ctx.strokeStyle = '#707070';
    ctx.lineWidth = w * (2/600);
    ctx.beginPath();
    ctx.moveTo(w*(300/600), h*(80/600));
    ctx.lineTo(w*(300/600), h*(400/600));
    ctx.stroke();

   
    
    ctx.beginPath();

    //handle
    ctx.fillStyle = '#D11A2A'
    ctx.fillRect(w*(285/600), h *(480/600), w*(30/600), h*(100/600));
    ctx.fillRect(w*(200/600), h*(480/600), w*(200/600), h*(20/600));
    
    //handle circles red
    ctx.beginPath();
    ctx.arc(w*(300/600), h*(570/600), w*(25/600), 0, 2 * Math.PI);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(w*(210/600), h*(490/600), w*(20/600), 0, 2 * Math.PI);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(w*(390/600), h*(490/600), w*(20/600), 0, 2 * Math.PI);
    ctx.fill();
    
    //white circles
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.arc(w*(265/600), h*(405/600), w*(15/600), 0, 2 * Math.PI); 
    ctx.fill();
    ctx.beginPath();
    ctx.arc(w*(335/600), h*(405/600), w*(15/600), 0, 2 * Math.PI); 
    ctx.fill();
    ctx.beginPath();
    ctx.arc(w*(300/600), h*(420/600), w*(12/600), 0, 2 * Math.PI); 
    ctx.fill();
    ctx.beginPath();
    ctx.arc(w*(300/600), h*(450/600), w*(8/600), 0, 2 * Math.PI); 
    ctx.fill();
    // handle cricles
    ctx.beginPath();
    ctx.arc(w*(300/600), h*(570/600), w*(12/600), 0, 2 * Math.PI); 
    ctx.fill();
    ctx.beginPath();
    ctx.arc(w*(210/600), h*(490/600), w*(9/600), 0, 2 * Math.PI); 
    ctx.fill();
    ctx.beginPath();
    ctx.arc(w*(390/600), h*(490/600), w*(9/600), 0, 2 * Math.PI); 
    ctx.fill();
   

    function drawDiamond(x,y,width,height){
    ctx.beginPath();
    degrees = 45; 

    ctx.save(); 

    ctx.translate(x, y); 
    ctx.rotate(degrees * Math.PI / 180); 
    ctx.fillRect(-width / 2, -height / 2, width, height);

    ctx.restore();  

    }
     // center diamond
    ctx.fillStyle = "darkblue"
    ctx.beginPath();
    drawDiamond(w*(300/600), h*(490/600), w*(40/600), h*(40/600));

    }

    drawSword(w,h);


    function X(v) { return w * (v / 600); }
    function Y(v) { return h * (v / 600); }

    function drawRing(x, y, size) {         
    ctx.beginPath();
    ctx.arc(x, y, size / 2, 0, Math.PI * 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(x, y, size / 5, 0, Math.PI * 2);
    ctx.stroke();
    }

    function drawFlame(x, y, size) {        
    ctx.beginPath();
    ctx.moveTo(x, y - size / 2);
    ctx.quadraticCurveTo(x + size * 0.55, y, x, y + size / 2);
    ctx.quadraticCurveTo(x - size * 0.55, y, x, y - size / 2);
    ctx.closePath();
    ctx.fill();
    }

    function drawZig(x, y, size) {           
    ctx.beginPath();
    ctx.moveTo(x, y - size / 2);
    ctx.lineTo(x + size * 0.5, y - size / 4);
    ctx.lineTo(x - size * 0.5, y);
    ctx.lineTo(x + size * 0.5, y + size / 4);
    ctx.lineTo(x, y + size / 2);
    ctx.stroke();
    }

    function drawSlashes(x, y, size) {      
    ctx.beginPath();
    ctx.moveTo(x - size * 0.55, y - size / 2);
    ctx.lineTo(x - size * 0.15, y + size / 2);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(x + size * 0.15, y - size / 2);
    ctx.lineTo(x + size * 0.55, y + size / 2);
    ctx.stroke();
    }

    function drawTriangle(x, y, size) {     
    ctx.beginPath();
    ctx.moveTo(x, y - size / 2);
    ctx.lineTo(x + size * 0.5, y + size / 2);
    ctx.lineTo(x - size * 0.5, y + size / 2);
    ctx.closePath();
    ctx.stroke();
    }

    function drawHalfCircle(x, y, size) {     
    ctx.beginPath();
    ctx.arc(x, y, size / 2, Math.PI * 0.15, Math.PI * 1.6);
    ctx.stroke();

    }

    
    function animate() {
            
            ctx.fillStyle = "white";
            ctx.fillRect(0, 0, w, h);

            
            drawSword(w, h);

            
            if (runesVisible) {
                const elapsed = (Date.now() - startTime) / 1000; 
                
                const colorIndex = Math.floor(elapsed * 9) % COLORS.length;
                const activeColor = COLORS[colorIndex];

                ctx.strokeStyle = activeColor;
                ctx.fillStyle   = activeColor;
                ctx.lineWidth   = X(2);

                drawTriangle(X(290), Y(100), X(10));        
                drawZig(X(301), Y(138), X(20));
                drawHalfCircle(X(312), Y(164), X(10));
                drawRing(X(303), Y(200), X(10));        
                drawZig(X(301), Y(240), X(20));
                drawFlame(X(288), Y(258), X(10));
                drawRing(X(312), Y(298), X(13));
                drawSlashes(X(292), Y(311), X(10));
                drawHalfCircle(X(303), Y(333), X(10));
                drawZig(X(301), Y(370), X(20));
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
