<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);

    ctx.fillStyle = "black";
    ctx.fillRect(0,0,w,h);

    let numCircles = prompt("How many circles?");
    const maxRadius = w * 0.45;
    const radiusIncr = maxRadius / numCircles;   

    const colors = [
	"#EF998D",
	"#F0AA75",
	"#EEBB61",
	"#E8776B",
	"#E678B2",
	"#C184D1",
	"#77B1B6",
	"#65D0A0",
	"#66D69E"
];
    let colorCounter = 0;

    for (let index = 1; index <= numCircles; index++) {

    let xPos = 300;
    let yPos = 300;
    let radius = radiusIncr*(index);

    ctx.beginPath();
    ctx.arc(
        xPos,
        yPos,
        radius,
        0,
        Math.PI*2,
        true
    );

    
     
    ctx.strokeStyle = colors[colorCounter]
    ctx.lineWidth = 3;
    ctx.stroke();
    
    if (colorCounter <= 9){
        colorCounter = colorCounter + 1
    } else {colorCounter = 1}

    }
   

</script>
