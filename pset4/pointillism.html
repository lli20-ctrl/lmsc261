<!DOCTYPE html>
<body>
    <canvas width="600" height="600" id="canvas" style="width: 600px; height: 600px;"></canvas>
</body>

<script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const w = canvas.width, h = canvas.height;

    const dpr = window.devicePixelRatio || 1;
    canvas.width *= dpr, canvas.height *= dpr;
    ctx.scale(dpr, dpr);

    ctx.fillStyle = "black";
    ctx.fillRect(0,0,w,h);


    for (let index = 0; index < 256; index++) {

    let xPos = Math.random()*600;
    let yPos = Math.random()*600;
    let radius = Math.random()*25;

    ctx.beginPath();
    ctx.arc(
        xPos,
        yPos,
        radius,
        90,
        Math.PI*2,
        true
    )

    if (yPos < 200) {
        ctx.fillStyle = "darkblue"
    } else if (yPos < 400 && yPos > 200) {
        ctx.fillStyle = "darkred"
    } else {
        ctx.fillStyle = "darkgreen"
    }

    ctx.fill(); 
        
    }
   

</script>
